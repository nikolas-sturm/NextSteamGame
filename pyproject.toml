[project]
name = "nextsteam-pipeline"
version = "0.1.0"
description = "Offline evidence and candidate graph pipeline"
requires-python = ">=3.13,<3.14"
dependencies = [
  "duckdb==1.4.3",
  "httpx==0.28.1",
  "polars==1.37.1",
  "pyarrow==22.0.0",
  "typer==0.21.0",
  "zvec==0.5.0",
]

[project.optional-dependencies]
ml = [
  "accelerate==1.12.0",
  "sentence-transformers==5.1.2",
  "torch==2.9.1",
  "transformers==4.57.3",
]



[project.scripts]
nextsteam-pipeline = "nextsteam_pipeline.cli:app"

[dependency-groups]
dev = [
  "mypy==1.19.1",
  "pytest==9.0.2",
  "pytest-cov==7.0.0",
  "respx==0.22.0",
  "ruff==0.14.10",
]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline/nextsteam_pipeline"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["pipeline"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["nextsteam_pipeline"]
mypy_path = "pipeline"
