services:
  api:
    build:
      context: ../..
      dockerfile: infra/containers/api.Dockerfile
    environment:
      ARTIFACT_DIR: /artifacts/current
      ALLOW_FIXTURE_ARTIFACTS: "${ALLOW_FIXTURE_ARTIFACTS:-1}"
      API_BIND: 0.0.0.0:8080
      CORS_ORIGINS: http://localhost:3000
      RUST_LOG: info,tower_http=info
    read_only: true
    volumes:
      - ${NEXTSTEAM_ARTIFACT_DIR:-../../builds/fixtures/releases/synthetic-fixture-v1}:/artifacts/current:ro
    ports:
      - "8080:8080"
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infra/containers/web.Dockerfile
    environment:
      API_BASE_URL: http://api:8080
      NEXT_TELEMETRY_DISABLED: "1"
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
