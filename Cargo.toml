[workspace]
members = [
    "crates/artifact-store",
    "crates/domain",
    "crates/recommendation-core",
    "crates/retrieval",
    "services/api",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
artifact-store = { path = "crates/artifact-store" }
async-trait = "=0.1.89"
axum = "=0.8.4"
domain = { path = "crates/domain" }
hex = "=0.4.3"
http = "=1.3.1"
proptest = "=1.7.0"
recommendation-core = { path = "crates/recommendation-core" }
retrieval = { path = "crates/retrieval" }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.142"
sha2 = "=0.10.9"
thiserror = "=2.0.12"
tokio = { version = "=1.47.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = { version = "=0.5.2", features = ["util"] }
tower-http = { version = "=0.6.6", features = ["cors", "limit", "request-id", "timeout", "trace"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["env-filter", "fmt"] }
uuid = { version = "=1.17.0", features = ["v4"] }
